# ZoneSort – Node 2 (feeder + conveyor + sorting) wiring
# Confirmed pinout as of 2026-10-30 (Gate A = G18 + CH11, Gate B = G19 + CH15). Hat label Pn = GPIOn.
# Render:  wireviz node2_wiring.yml   -> node2_wiring.svg / .png / .html (BOM)

metadata:
  title: ZoneSort Node 2 – Feeder, Conveyor & Sorting Wiring

connectors:
  ESP32:
    type: ESP32-WROOM-32 DevKit (38-pin)
    subtype: USB-C powered (2 A charger)
    pinlabels: [GND, 3V3, 5V, G18, G19, G21, G22, G25, G26]
    pincolors: [BK, RD, OG, VT, VT, BU, YE, GN, GN]

  PCA9685:
    type: PCA9685 16-ch servo driver
    subtype: logic header (I2C 0x40)
    pinlabels: [GND, VCC, SDA, SCL]
  PCA_PWR:
    type: PCA9685
    subtype: V+ screw terminal (servo power)
    pinlabels: [V+, GND]
    notes: 1000 µF capacitor across V+ / GND (stripe to GND)
  PCA_OUT:
    type: PCA9685
    subtype: servo outputs
    pinlabels: [CH0, CH11, CH15]

  SERVO_PUSH:
    type: MG90S – feeder pusher
    pinlabels: [PWM]
  SERVO_A:
    type: MG90S – gate A diverter
    pinlabels: [PWM]
  SERVO_B:
    type: MG90S – gate B diverter
    pinlabels: [PWM]

  TOF:
    type: VL53L0X ToF
    subtype: I2C 0x29, on belt (parcel entry + length timing)
    pinlabels: [VIN, GND, SDA, SCL]

  KY1:
    type: KY-032 IR obstacle – gate B
    subtype: EN unconnected (jumper on)
    pinlabels: [+, GND, OUT]
  KY2:
    type: KY-032 IR obstacle – gate A
    subtype: EN unconnected (jumper on)
    pinlabels: [+, GND, OUT]

  ADP12:
    type: 12 V 2 A adapter
    pinlabels: [+12V, GND]
  BUCK:
    type: Buck converter
    subtype: set OUT to 9.5 V before connecting
    pinlabels: [IN+, IN-, OUT+, OUT-]

  DRV8833:
    type: DRV8833 motor driver
    subtype: VM max 10.8 V · ULT unconnected
    pinlabels: [VM, GND, EEP, AIN1, AIN2, AOUT1, AOUT2]
  MOTOR:
    type: N20 worm gear motor (12 V)
    subtype: belt drive roller
    pinlabels: [M1, M2]

cables:
  W_PCA:
    category: bundle
    wirecount: 4
    colors: [BK, RD, BU, YE]
  W_SERVO_PWR:
    category: bundle
    wirecount: 2
    colors: [OG, BK]
    notes: ESP32 5V pin to PCA V+ terminal
  W_SERVO:
    category: bundle
    wirecount: 3
    colors: [OG, OG, OG]
    notes: Signal shown; each servo plug also carries V+ and GND from the PCA header
  W_TOF:
    category: bundle
    wirecount: 4
    colors: [RD, BK, BU, YE]
  W_KY1:
    category: bundle
    wirecount: 3
    colors: [RD, BK, VT]
  W_KY2:
    category: bundle
    wirecount: 3
    colors: [RD, BK, VT]
  W_12V:
    category: bundle
    wirecount: 2
    colors: [RD, BK]
  W_9V:
    category: bundle
    wirecount: 2
    colors: [RD, BK]
  W_DRV_CTRL:
    category: bundle
    wirecount: 4
    colors: [BK, RD, GN, GN]
    notes: GND ties ESP32 ground to the motor supply ground
  W_MOTOR:
    category: bundle
    wirecount: 2
    colors: [WH, WH]

connections:
  # I2C bus: PCA9685 logic
  -
    - ESP32: [GND, 3V3, G21, G22]
    - W_PCA: [1-4]
    - PCA9685: [GND, VCC, SDA, SCL]

  # I2C bus: ToF (shares G21/G22)
  -
    - ESP32: [3V3, GND, G21, G22]
    - W_TOF: [1-4]
    - TOF: [VIN, GND, SDA, SCL]

  # Servo power from ESP32 5V pin
  -
    - ESP32: [5V, GND]
    - W_SERVO_PWR: [1-2]
    - PCA_PWR: [V+, GND]

  # Servo signals
  -
    - PCA_OUT: [CH0]
    - W_SERVO: [1]
    - SERVO_PUSH: [PWM]
  -
    - PCA_OUT: [CH11]
    - W_SERVO: [2]
    - SERVO_A: [PWM]
  -
    - PCA_OUT: [CH15]
    - W_SERVO: [3]
    - SERVO_B: [PWM]

  # IR obstacle sensors
  -
    - ESP32: [3V3, GND, G19]
    - W_KY1: [1-3]
    - KY1: [+, GND, OUT]
  -
    - ESP32: [3V3, GND, G18]
    - W_KY2: [1-3]
    - KY2: [+, GND, OUT]

  # Motor power: 12 V -> buck (9.5 V) -> DRV8833
  -
    - ADP12: [+12V, GND]
    - W_12V: [1-2]
    - BUCK: [IN+, IN-]
  -
    - BUCK: [OUT+, OUT-]
    - W_9V: [1-2]
    - DRV8833: [VM, GND]

  # Motor control from ESP32 (EEP held high to enable)
  -
    - ESP32: [GND, 3V3, G25, G26]
    - W_DRV_CTRL: [1-4]
    - DRV8833: [GND, EEP, AIN1, AIN2]

  # Motor output
  -
    - DRV8833: [AOUT1, AOUT2]
    - W_MOTOR: [1-2]
    - MOTOR: [M1, M2]
